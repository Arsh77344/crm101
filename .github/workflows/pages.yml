name: Deploy Commerce OS to GitHub Pages

# The app lives on the commerce-os branch; this workflow runs from the default
# branch so it satisfies the github-pages environment rule, and builds that branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /crm101
      NEXT_PUBLIC_SUPABASE_URL: https://fszhitnhcintmuktnzdd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzemhpdG5oY2ludG11a3RuemRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNDAxMTUsImV4cCI6MjEwOTkxNjExNX0.8aVJ-KYEKLkbMnr-W3dIMXlFKqo3QdFQNK5psIOmlS4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commerce-os
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx next build
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
