# One-click staging deploy: https://render.com/deploy?repo=https://github.com/Arsh77344/crm101
services:
  - type: web
    name: commerce-business-os
    runtime: python
    plan: free
    buildCommand: pip install -r app/requirements-team.txt
    startCommand: python app/team_start.py --no-browser
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BIND_HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: CRM_OWNER_PASSWORD
        generateValue: true
      - key: CRM_SALES_PASSWORD
        generateValue: true
